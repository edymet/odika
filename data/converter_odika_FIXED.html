<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Converter – ΟΔΙΚΑ Έργα</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f1f5f9;padding:20px;color:#1e293b}
h1{font-size:17px;color:#1E3A5F;margin-bottom:4px}
.sub{font-size:12px;color:#64748b;margin-bottom:18px}
.card{background:#fff;border-radius:10px;padding:18px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.card h2{font-size:13px;font-weight:700;color:#1E3A5F;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid #e2e8f0}
.dz{border:2px dashed #cbd5e1;border-radius:8px;padding:28px;text-align:center;cursor:pointer;transition:.2s;background:#f8fafc;font-size:13px;color:#64748b}
.dz:hover,.dz.drag{border-color:#3b82f6;background:#eff6ff;color:#1d4ed8}
.dz b{display:block;font-size:15px;margin-bottom:4px;color:#1E3A5F}
input[type=file]{display:none}
.status{margin-top:10px;padding:10px 14px;border-radius:7px;font-size:12px;display:none}
.ok{background:#dcfce7;color:#166534;border:1px solid #86efac;display:block}
.err{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;display:block}
.info{background:#dbeafe;color:#1d4ed8;border:1px solid #93c5fd;display:block}
.btns{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
button{padding:9px 18px;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:6px}
button:disabled{opacity:.4;cursor:not-allowed}
.btn-erga{background:#1E3A5F;color:#fff}.btn-erga:hover:not(:disabled){background:#2d5282}
.btn-detail{background:#0F5132;color:#fff}.btn-detail:hover:not(:disabled){background:#145a38}
.btn-both{background:#5C2D91;color:#fff}.btn-both:hover:not(:disabled){background:#6d35a8}
#prev{display:none;margin-top:12px;overflow-x:auto}
table{border-collapse:collapse;font-size:11px;width:100%}
th{background:#1E3A5F;color:#fff;padding:5px 8px;text-align:left;font-size:11px}
td{padding:4px 8px;border-bottom:1px solid #e2e8f0;vertical-align:top}
tr:nth-child(even) td{background:#f8fafc}
.badge{display:inline-block;padding:2px 7px;border-radius:12px;font-size:10px;font-weight:700;color:#fff}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;font-size:11px}
.leg-item{display:flex;align-items:center;gap:5px}
.leg-dot{width:12px;height:12px;border-radius:3px}
</style>
</head>
<body>

<h1>🔄 Converter – Βάση Οδικών Έργων</h1>
<p class="sub">Φόρτωσε το <strong>ERGA_ODIKA_UNIFIED.xlsx</strong> και δημιούργησε αυτόματα το <code>erga_odika.js</code> για το site των οδικών αξόνων</p>

<div class="card">
  <h2>📂 Επιλογή Αρχείου</h2>
  <div class="dz" id="dz">
    <b>📥 Σύρε εδώ το ERGA_ODIKA_UNIFIED.xlsx</b>
    ή κάνε κλικ για να επιλέξεις αρχείο
  </div>
  <input type="file" id="fi" accept=".xlsx,.xls">
  <div class="status" id="st"></div>
</div>

<div class="card" id="preview-card" style="display:none">
  <h2>👁️ Προεπισκόπηση</h2>
  <div class="legend">
    <div class="leg-item"><div class="leg-dot" style="background:#22c55e"></div>ΠΜΕΤ 2021-27</div>
    <div class="leg-item"><div class="leg-dot" style="background:#6b7280"></div>ΠεΠ 2021-27</div>
    <div class="leg-item"><div class="leg-dot" style="background:#a855f7"></div>INTERREG</div>
  </div>
  <div id="prev"></div>
  <div class="btns">
    <button class="btn-erga" id="btn-erga" disabled>🛣️ Κατέβασε erga_odika.js</button>
    <button class="btn-detail" id="btn-detail" disabled>📋 Κατέβασε detail_data.js</button>
    <button class="btn-both" id="btn-both" disabled>⚡ Κατέβασε ΚΑΙ ΤΑ ΔΥΟ</button>
  </div>
  <div class="status" id="st2"></div>
</div>

<script>
var parsed = null;
var parsedRaw = null;
var updatedDate = null;

// Μορφοποιεί αριθμό στην ελληνική σύμβαση: τελεία για χιλιάδες, κόμμα για δεκαδικά (π.χ. 57.086.918,45 €)
function formatGreekCurrency(num){
  if(typeof num!=='number'||isNaN(num)) return null;
  var fixed=num.toFixed(2);
  var parts=fixed.split('.');
  var intPart=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return intPart+','+parts[1]+' €';
}

var PROG_COLORS = {
  'ΠΜΕΤ 21-27':'#22c55e','ΠΜΕΤ 2021-27':'#22c55e',
  'ΠεΠ 21-27':'#6b7280','ΠεΠ 2021-27':'#6b7280',
  'INTERREG 21-27':'#a855f7','INTERREG 2021-27':'#a855f7'
};

function ss(msg,cls,el){el=el||document.getElementById('st');el.textContent=msg;el.className='status '+cls}

var dz=document.getElementById('dz'),fi=document.getElementById('fi');
var prev=document.getElementById('prev');
var btnErga=document.getElementById('btn-erga');
var btnDetail=document.getElementById('btn-detail');
var btnBoth=document.getElementById('btn-both');
var previewCard=document.getElementById('preview-card');

dz.addEventListener('click',function(){fi.click()});
dz.addEventListener('dragover',function(e){e.preventDefault();dz.classList.add('drag')});
dz.addEventListener('dragleave',function(){dz.classList.remove('drag')});
dz.addEventListener('drop',function(e){e.preventDefault();dz.classList.remove('drag');load(e.dataTransfer.files[0])});
fi.addEventListener('change',function(e){load(e.target.files[0])});

function load(file){
  ss('Φόρτωση...','info');
  var r=new FileReader();
  r.onload=function(e){
    try{
      var wb=XLSX.read(e.target.result,{type:'array',cellDates:true,dateNF:'DD.MM.YYYY'});
      var shName = wb.SheetNames.find(function(n){return n.indexOf('ΒΑΣΗ')>=0||n.indexOf('ΟΔΙΚ')>=0||n===wb.SheetNames[0]});
      var ws=wb.Sheets[shName];
      var all=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});
      // Παράλληλη ανάγνωση ΑΚΑΤΕΡΓΑΣΤΩΝ τιμών (χωρίς μορφοποίηση) — χρειάζεται για να
      // ξαναφορμάρουμε εμείς τα χρηματικά ποσά στην ελληνική σύμβαση (τελεία χιλιάδων, κόμμα δεκαδικών),
      // αφού η SheetJS μορφοποιεί αριθμούς πάντα σε αγγλοσαξονική μορφή (κόμμα χιλιάδων, τελεία δεκαδικών).
      var allRaw=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});

      var hdrIdx=all.findIndex(function(row){return String(row[0]).trim()==='ID'});
      if(hdrIdx<0) throw new Error('Δεν βρέθηκε γραμμή επικεφαλίδων (ID)');
      // Ημερομηνία ενημέρωσης: κελί D1 (δίπλα στον τίτλο, γραμμή 1) — διαβάζεται ως απλό κείμενο
      updatedDate = String((all[0] && all[0][3]) || '').trim() || null;
      // Normalize line breaks in headers (Excel stores \r\n, code below expects \n)
      var hdr=all[hdrIdx].map(function(h){return String(h||'').replace(/\r\n/g,'\n')});
      var data=all.slice(hdrIdx+1).filter(function(row){return row[0]&&String(row[0]).trim()!==''&&!isNaN(parseInt(row[0]))});
      var dataRaw=allRaw.slice(hdrIdx+1).filter(function(row){return row[0]&&String(row[0]).trim()!==''&&!isNaN(parseInt(row[0]))});

      parsed=data.map(function(row){
        var obj={};
        hdr.forEach(function(h,i){obj[h]=String(row[i]||'').trim()});
        return obj;
      });
      parsedRaw=dataRaw.map(function(row){
        var obj={};
        hdr.forEach(function(h,i){obj[h]=row[i]});
        return obj;
      });

      previewCard.style.display='block';
      prev.innerHTML='<p style="margin-bottom:8px;font-weight:700;color:#1E3A5F">✅ Φορτώθηκαν '+parsed.length+' έργα από το sheet «'+shName+'»'+(updatedDate?' &nbsp;·&nbsp; 🗓️ Ενημέρωση: '+updatedDate:'')+'</p>'+
        '<table><thead><tr><th>ID</th><th>Πρόγραμμα</th><th>Τίτλος</th><th>Κατάσταση</th></tr></thead><tbody>'+
        parsed.slice(0,8).map(function(p){
          var col=PROG_COLORS[p['Tab (Πρόγραμμα)']||p['Πρόγραμμα']]||'#64748b';
          var stat=((p['Κατάσταση / Ποσοστά %\n(σύντομη – αρχικό popup)']||'')).substring(0,40);
          return '<tr><td><b>'+p['ID']+'</b></td>'+
            '<td><span class="badge" style="background:'+col+'">'+((p['Tab (Πρόγραμμα)']||p['Πρόγραμμα'])||'').substring(0,16)+'</span></td>'+
            '<td>'+((p['Τίτλος Έργου']||'')).substring(0,45)+'</td>'+
            '<td>'+stat+'</td></tr>';
        }).join('')+
        (parsed.length>8?'<tr><td colspan="4" style="color:#94a3b8;font-style:italic">…+'+(parsed.length-8)+' ακόμη έργα</td></tr>':'')+
        '</tbody></table>';

      btnErga.disabled=false; btnDetail.disabled=false; btnBoth.disabled=false;
      ss('Έτοιμο! Κατέβασε τα αρχεία.','ok');
    }catch(ex){ss('Σφάλμα: '+ex.message,'err');console.error(ex)}
  };
  r.readAsArrayBuffer(file);
}

function buildErgaOdika(){
  if(!parsed) return null;
  var features=parsed.map(function(row,idx){
    var rawRow=parsedRaw?parsedRaw[idx]:null;
    var tab=row['Tab (Πρόγραμμα)']||row['Πρόγραμμα']||'';
    var lat=parseFloat((row['Γεωγρ. Πλάτος']||'').replace(',','.'))||0;
    var lng=parseFloat((row['Γεωγρ. Μήκος']||'').replace(',','.'))||0;
    var labels=[row['Ετικέτα % 1'],row['Ετικέτα % 2'],row['Ετικέτα % 3']].filter(function(x){return x&&x.trim()!==''});
    // Χρηματοδότηση: αν το κελί είναι αριθμός, φορμάρισέ το εμείς σε ελληνική σύμβαση
    // (η SheetJS μορφοποιεί αριθμούς πάντα αγγλοσαξονικά, εξ ου και έβγαινε "ανάποδα")
    var rawBudg = rawRow ? rawRow['Χρηματοδότηση'] : null;
    var budgFund = (typeof rawBudg==='number') ? formatGreekCurrency(rawBudg) : (row['Χρηματοδότηση']||null);
    return{
      type:'Feature',
      properties:{
        id:parseInt(row['ID'],10),
        'name ID':row['Σύντομο Όνομα']||'',
        title:row['Τίτλος Έργου']||'',
        mis_code:row['Κωδικός MIS']||null,
        fund_prog:row['Πρόγραμμα']||tab,
        'descr/tion':row['Αντικείμενο\n(σύντομο – αρχικό popup)']||null,
        budg_fund:budgFund,
        contract_a:row['Ποσό Σύμβασης']||null,
        contractor:row['Ανάδοχος']||null,
        sign_date:row['Ημ. Υπογραφής']||null,
        deadline:row['Προθεσμία (σύντομη)']||null,
        status:row['Κατάσταση / Ποσοστά %\n(σύντομη – αρχικό popup)']||null,
        critical_i:row['Κρίσιμα Θέματα\n(χάρτης)']||null,
        link:row['Link']||null,
        pct_labels:labels.length>0?labels:null,
        category:tab||null
      },
      geometry:{type:'Point',coordinates:[lng,lat]}
    };
  });
  return {type:'FeatureCollection',name:'erga_odika',
    crs:{type:'name',properties:{name:'urn:ogc:def:crs:OGC:1.3:CRS84'}},
    updated_at:updatedDate,
    features:features};
}

function buildDetailData(){
  if(!parsed) return null;
  var result={};
  parsed.forEach(function(row){
    var pid=String(row['ID']||'').trim();
    if(!pid||isNaN(parseInt(pid))) return;
    var tab=row['Tab (Πρόγραμμα)']||row['Πρόγραμμα']||'';
    var fields=[];
    var descr=(row['Αντικείμενο\n(αναλυτικό – Περισσότερες πληροφορίες)']||'').trim();
    var status=(row['Κατάσταση\n(αναλυτική – Περισσότερες πληροφορίες)']||'').trim();
    if(descr) fields.push({key:'descr',label:'Αντικείμενο',value:descr,type:'long'});
    if(status) fields.push({key:'status',label:'Κατάσταση',value:status,type:'long'});
    result[pid]={sheet:tab,fields:fields};
  });
  return result;
}

function download(content, filename){
  var blob=new Blob([content],{type:'text/javascript'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=filename; a.click();
}

btnErga.addEventListener('click',function(){
  try{
    var geojson=buildErgaOdika();
    download('var json_erga_odika = '+JSON.stringify(geojson,null,2)+';','erga_odika.js');
    ss('✅ erga_odika.js κατεβάζεται ('+geojson.features.length+' έργα). Βάλε το στον φάκελο data/ του site.','ok',document.getElementById('st2'));
  }catch(ex){ss('Σφάλμα: '+ex.message,'err',document.getElementById('st2'));}
});

btnDetail.addEventListener('click',function(){
  try{
    var dd=buildDetailData();
    var cnt=Object.keys(dd).length;
    download('var DETAIL_DATA = '+JSON.stringify(dd,null,2)+';\n','detail_data.js');
    ss('✅ detail_data.js κατεβάζεται ('+cnt+' έργα). Βάλε το στον φάκελο data/ του site.','ok',document.getElementById('st2'));
  }catch(ex){ss('Σφάλμα: '+ex.message,'err',document.getElementById('st2'));}
});

btnBoth.addEventListener('click',function(){
  try{
    var geojson=buildErgaOdika();
    download('var json_erga_odika = '+JSON.stringify(geojson,null,2)+';','erga_odika.js');
    var dd=buildDetailData();
    setTimeout(function(){
      download('var DETAIL_DATA = '+JSON.stringify(dd,null,2)+';\n','detail_data.js');
    }, 300);
    ss('✅ Κατεβαίνουν και τα δύο αρχεία. Βάλε τα στον φάκελο data/ του site.','ok',document.getElementById('st2'));
  }catch(ex){ss('Σφάλμα: '+ex.message,'err',document.getElementById('st2'));}
});
</script>
</body>
</html>
